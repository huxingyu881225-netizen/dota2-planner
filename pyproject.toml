[project]
name = "dota2-assistant"
version = "0.2.0"
description = "Local Dota 2 planner/coach: 解析本地 .dem 录像(gem-dota) -> SQLite 行为库, 浮窗教练, 赛后对比, 编辑界面."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gem-dota>=0.5",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2"]

[project.scripts]
dota = "dota_assistant.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dota_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
