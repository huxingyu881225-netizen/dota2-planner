<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>dota:assistant 建议编辑器</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif; margin: 2rem auto; max-width: 900px; background: #0f1115; color: #e6e8ee; }
  h1 { font-size: 1.3rem; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  label { font-size: .85rem; color: #9aa0af; }
  select, input, textarea, button { font-size: .9rem; padding: .4rem .6rem; border-radius: 8px; border: 1px solid #2c3140; background: #171a22; color: #e6e8ee; }
  textarea { width: 100%; }
  button { cursor: pointer; background: #2b6cb0; border: none; color: #fff; }
  button.danger { background: #7f1d1d; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .85rem; }
  th, td { border: 1px solid #2c3140; padding: .4rem .5rem; text-align: left; vertical-align: top; }
  th { background: #171a22; }
  .tag { display: inline-block; margin-right: .25rem; }
  .stats { color: #9aa0af; font-size: .8rem; margin-bottom: 1rem; }
  #editor { margin-top: 1rem; padding: 1rem; border: 1px dashed #3a4152; border-radius: 10px; display: none; }
</style>
</head>
<body>
<h1>🎮 dota:assistant — 建议行为编辑器</h1>
<div class="stats" id="stats"></div>

<div class="row">
  <label>英雄 <input id="f-hero" placeholder="juggernaut" size="14"/></label>
  <label>位置
    <select id="f-pos">
      <option value="">全部</option>
      <option>carry</option><option>mid</option><option>offline</option>
      <option>offlane_support</option><option>safelane_support</option>
    </select>
  </label>
  <button onclick="load()">查询</button>
  <button onclick="showNew()">新增建议</button>
</div>

<div id="editor">
  <h3 id="editor-title">新增建议</h3>
  <div class="row">
    <label>英雄 <input id="e-hero" size="14"/></label>
    <label>位置 <select id="e-pos">
      <option>carry</option><option>mid</option><option>offline</option>
      <option>offlane_support</option><option>safelane_support</option>
    </select></label>
    <label>起始分钟 <input id="e-start" type="number" step="0.5" value="0"/></label>
    <label>结束分钟 <input id="e-end" type="number" step="0.5" value="5"/></label>
  </div>
  <p><label>建议文本 <textarea id="e-advice" rows="3"></textarea></label></p>
  <div class="row"><button onclick="save()">保存</button> <button class="danger" onclick="hideEditor()">取消</button></div>
</div>

<table id="table">
  <thead><tr><th>英雄</th><th>位置</th><th>时间段(分)</th><th>建议</th><th>来源</th><th>更新时间</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>
